<style>
    /* Estilos Específicos para o Modelo 2 (TI/Moderno) - CORRIGIDO PARA PDF */
    .cv-container {
        width: 210mm;
        min-height: 297mm;
        background: white;
        font-family: 'Calibri', sans-serif;
        color: #333;
        box-sizing: border-box;
        font-size: 10.5pt;
        line-height: 1.4;
        padding: 0; /* Remove padding do container principal */
    }

    /* Coluna Lateral (FLOAT) */
    .col-left {
        width: 60mm;
        background-color: #f2f2f2;
        padding: 20mm 10mm;
        box-sizing: border-box;
        float: left; /* USO DE FLOAT PARA MAIOR COMPATIBILIDADE PDF */
        min-height: 297mm; /* Garante que o fundo cinza preencha toda a página */
    }

    /* Coluna Principal (FLOAT) */
    .col-right {
        width: 150mm;
        padding: 20mm;
        box-sizing: border-box;
        float: left; /* USO DE FLOAT PARA MAIOR COMPATIBILIDADE PDF */
    }

    /* Limpeza de Float (Importante!) */
    .clearfix::after {
        content: "";
        display: table;
        clear: both;
    }
    
    /* Demais estilos... */
    .cv-name {
        font-size: 18pt;
        font-weight: bold;
        color: #007bff;
        margin: 0;
        text-transform: uppercase;
        border-bottom: 2px solid #007bff;
        padding-bottom: 5px;
        margin-bottom: 15px;
        width: 100%;
    }
    
    .cv-section {
        margin-bottom: 20px;
        page-break-inside: avoid;
    }

    .cv-section-title {
        font-size: 12pt;
        font-weight: bold;
        text-transform: uppercase;
        color: #007bff;
        border-bottom: 1px solid #007bff;
        padding-bottom: 3px;
        margin-bottom: 10px;
    }

    .col-left .cv-section-title {
        color: #333;
        border-bottom-color: #999;
    }

    .contact-item {
        font-size: 9.5pt;
        margin-bottom: 8px;
        word-break: break-word;
    }

    .skills-text {
        font-size: 9.5pt;
        white-space: pre-line;
    }

    /* Experiência / Educação (coluna direita) */
    .job-item, .edu-item {
        margin-bottom: 14px;
        page-break-inside: avoid;
    }

    .job-header {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        font-weight: bold;
    }

    .job-role {
        font-size: 11pt;
        color: #222;
    }

    .job-date {
        font-size: 9.5pt;
        color: #777;
    }

    .job-company {
        font-style: italic;
        font-size: 10pt;
        margin-bottom: 4px;
        color: #555;
    }

    .job-desc {
        text-align: justify;
    }

    .edu-course {
        font-weight: bold;
        font-size: 10.5pt;
    }

    .edu-school {
        font-size: 10pt;
        color: #555;
    }

    .objetivo-text {
        text-align: justify;
    }
</style>

<div class="cv-container clearfix">
    <div class="col-left">
        <h1 class="cv-name">{{NOME}}</h1>

        <div class="cv-section">
            <div class="cv-section-title">Contato</div>
            <div class="contact-item">{{CIDADE}}</div>
            <div class="contact-item">{{TELEFONE}}</div>
            <div class="contact-item">{{EMAIL}}</div>
            <div class="contact-item">{{LINKEDIN}}</div>
        </div>

        <div class="cv-section">
            <div class="cv-section-title">Habilidades</div>
            <div class="skills-text">{{HABILIDADES}}</div>
        </div>
    </div>

    <div class="col-right">
        <div class="cv-section">
            <div class="cv-section-title">Objetivo Profissional</div>
            <p class="objetivo-text">{{OBJETIVO}}</p>
        </div>

        <div class="cv-section">
            <div class="cv-section-title">Experiência Profissional</div>
            {{EXPERIENCIAS}}
        </div>

        <div class="cv-section">
            <div class="cv-section-title">Formação Acadêmica</div>
            {{FORMACAO}}
        </div>
    </div>
</div>
